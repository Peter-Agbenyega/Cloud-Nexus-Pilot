name: Monorepo CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - cloud-nexus-pilot
          - devops-automation-agency
          - cloud-security-digital-factory
          - ai-automation-agency
          - cloud-nexus-market
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm install
      - name: Lint
        working-directory: ${{ matrix.project }}
        run: npm run lint
      - name: Typecheck
        working-directory: ${{ matrix.project }}
        run: npm run typecheck
      - name: Build
        working-directory: ${{ matrix.project }}
        run: npm run build
