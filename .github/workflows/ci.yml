name: Monorepo CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - apps/cloud-nexus-pilot
          - apps/devops-automation-agency
          - apps/cloud-security-digital-factory
          - apps/ai-automation-agency
          - apps/cloud-nexus-market
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: npm install
      - name: Install dependencies
        run: npm install --workspace ${{ matrix.project }}
      - name: Lint
        run: npm run lint --workspace ${{ matrix.project }}
      - name: Typecheck
        run: npm run typecheck --workspace ${{ matrix.project }}
      - name: Build
        run: npm run build --workspace ${{ matrix.project }}
