name: Monorepo CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - apps/cloud-nexus-pilot
          - apps/devops-automation-agency
          - apps/cloud-security-digital-factory
          - apps/ai-automation-agency
          - apps/cloud-nexus-market
          - apps/pilot-realtime-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Select declared npm version
        run: npm install --global npm@10.9.9
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace ${{ matrix.project }}
      - name: Typecheck
        run: npm run typecheck --workspace ${{ matrix.project }}
      - name: Build
        run: npm run build --workspace ${{ matrix.project }}
      - name: Test realtime API
        if: matrix.project == 'apps/pilot-realtime-api'
        run: npm run test:run --workspace ${{ matrix.project }}
      - name: Test Pilot frontend workflows
        if: matrix.project == 'apps/cloud-nexus-pilot'
        run: npm run test --workspace ${{ matrix.project }}
      - name: Test realtime release operations
        if: matrix.project == 'apps/pilot-realtime-api'
        run: npm run test:realtime-ops
