services:
  pilot-realtime-api:
    build:
      context: ../..
      dockerfile: apps/pilot-realtime-api/Dockerfile
    image: cloud-nexus-pilot-realtime:foundation
    container_name: cloud-nexus-pilot-realtime
    restart: unless-stopped
    init: true

    env_file:
      - .env

    # Keep the container port aligned with the Docker health check.
    environment:
      PORT: "3010"

    ports:
      - "127.0.0.1:3010:3010"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=64m

    stop_grace_period: 15s
