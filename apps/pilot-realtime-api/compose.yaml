services:
  pilot-realtime-api:
    build:
      context: ../..
      dockerfile: apps/pilot-realtime-api/Dockerfile
    image: cloud-nexus-pilot-realtime:${REALTIME_RELEASE:?Set REALTIME_RELEASE to the deployed Git SHA}
    container_name: cloud-nexus-pilot-realtime
    restart: unless-stopped
    init: true

    env_file:
      - ${REALTIME_ENV_FILE:-.env}

    # Keep the container port aligned with the Docker health check.
    environment:
      PORT: "3010"
      HOST: "127.0.0.1"
      # Caddy connects from the host loopback interface. Host networking makes
      # that peer address deterministic and avoids trusting a Docker subnet.
      WS_TRUSTED_PROXY_CIDRS: "127.0.0.1/32"

    # Production is Linux. The process itself binds only to loopback, so host
    # networking does not expose 3010 on a public interface.
    network_mode: host

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=64m

    stop_grace_period: 15s
